#
# GitHub retires old action runtimes, so stale major versions stop
# working.  All updates arrive grouped in one weekly pull request.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
